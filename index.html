<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f1">
<title>Hey… One Question</title>
<style>
:root{--coral:#ff5f6d;--coral-d:#e04656;--blush:#ffd9de;--cream:#fff7f1;--ink:#3b1722;--mute:#7a5560;--ease:cubic-bezier(.34,1.4,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:ui-rounded,"SF Pro Rounded","Avenir Next","Trebuchet MS",system-ui,sans-serif;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
background:radial-gradient(circle at 100% 0,#ffc7cf 0,transparent 48%),radial-gradient(circle at 0 100%,#ffdcc9 0,transparent 52%),var(--cream)}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 24px calc(env(safe-area-inset-bottom,0px) + 22px)}
#track{height:6px;border-radius:6px;background:rgba(255,95,109,.18);overflow:hidden;opacity:0;transition:opacity .3s}
body.game #track{opacity:1}
#track b{display:block;height:100%;width:0;border-radius:6px;background:var(--coral);transition:width .6s var(--ease)}
#app{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.card{display:flex;flex-direction:column;gap:20px;animation:in .6s var(--ease) both;max-height:100%}
@keyframes in{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}
.emo{font-size:3.4rem;line-height:1;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(5deg)}}
h1{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-size:clamp(2rem,8.6vw,2.7rem);line-height:1.12;margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0;font-size:1.2rem;line-height:1.45;color:var(--mute);font-weight:500}
.btns{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.btn{width:100%;min-height:72px;border:0;border-radius:36px;font:inherit;font-size:1.25rem;font-weight:800;padding:14px 24px;cursor:pointer;color:#fff;background:var(--coral);box-shadow:0 10px 24px rgba(255,95,109,.35);transition:transform .18s var(--ease),box-shadow .18s}
.btn:active{transform:scale(.96);box-shadow:0 4px 10px rgba(255,95,109,.3)}
.btn.alt{background:#fff;color:var(--coral-d);box-shadow:inset 0 0 0 2px var(--blush)}
.ghost{background:none;border:0;font:inherit;font-weight:700;font-size:1.05rem;color:var(--mute);padding:14px;min-height:52px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
input{width:100%;font:inherit;font-size:1.6rem;font-weight:700;text-align:center;padding:20px;border-radius:30px;border:3px solid var(--blush);background:#fff;color:var(--ink);outline:0;user-select:text;-webkit-user-select:text}
input:focus{border-color:var(--coral);box-shadow:0 0 0 6px rgba(255,95,109,.15)}
.shake{animation:shake .4s}
@keyframes shake{25%,75%{transform:translateX(-10px)}50%{transform:translateX(10px)}}
.logo{font-size:clamp(3.2rem,16vw,4.6rem)}
.zone{display:none;position:fixed;top:0;width:64px;height:64px;border:0;background:transparent;padding:0;z-index:50}
#zl{left:0}#zr{right:0}
body.game #zl{display:block}body.home #zr{display:block}
/* bucket */
.count{font-family:Georgia,serif;font-size:3.6rem;font-weight:700;color:var(--coral-d);line-height:1}
#list{display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:48vh;padding:2px 2px 8px;text-align:left;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:14px;align-items:center;background:#fff;border-radius:24px;padding:14px 16px;box-shadow:0 4px 14px rgba(224,70,86,.1)}
.av{flex:none;width:50px;height:50px;border-radius:50%;background:var(--coral);color:#fff;font-weight:800;font-size:1.4rem;display:grid;place-items:center}
.row div:last-child{min-width:0}
.row b{display:block;font-size:1.2rem;overflow:hidden;text-overflow:ellipsis}
.row a{color:var(--coral-d);font-weight:700;font-size:1.1rem;text-decoration:none;user-select:text;-webkit-user-select:text}
.row small{display:block;color:var(--mute)}
.danger{color:var(--coral-d)}
.warn{background:#fff;border-radius:16px;padding:10px 14px;font-size:.9rem;font-weight:600;color:var(--coral-d)}
/* reactions */
.fx{position:fixed;left:50%;top:42%;font-size:2.2rem;pointer-events:none;z-index:60;animation:fly .95s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4) rotate(var(--r));opacity:0}}
.conf{position:fixed;top:-30px;pointer-events:none;z-index:55;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body class="home">
<button id="zl" class="zone" aria-label="Owner exit"></button>
<button id="zr" class="zone" aria-label="Owner area"></button>
<div id="stage">
  <div id="track"><b></b></div>
  <main id="app"></main>
</div>
<script>
(function(){
"use strict";
var KEY="hey_one_question_bucket_v1",TOTAL=5;
var store=null,mem=[];
try{localStorage.setItem("__t","1");localStorage.removeItem("__t");store=localStorage;}catch(e){}
function load(){try{if(store){var v=JSON.parse(store.getItem(KEY)||"[]");return Array.isArray(v)?v:[];}}catch(e){}return mem.slice();}
function save(a){mem=a.slice();try{if(store)store.setItem(KEY,JSON.stringify(a));}catch(e){store=null;}}

var app=document.getElementById("app"),fill=document.querySelector("#track b");
var name="",confirmEmpty=false,emptyTimer=0;
var $=function(s){return document.querySelector(s)};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function mode(m,step){document.body.className=m;fill.style.width=(step?step/TOTAL*100:0)+"%";}
function show(html){app.innerHTML='<div class="card">'+html+'</div>';var i=app.querySelector("input");if(i&&document.body.classList.contains("game"))setTimeout(function(){try{i.focus()}catch(e){}},450);}

function burst(emojis,n){n=n||9;for(var i=0;i<n;i++){var s=document.createElement("div");s.className="fx";s.textContent=pick(emojis);
var a=Math.random()*Math.PI*2,d=80+Math.random()*120;
s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d-40+"px");s.style.setProperty("--r",(Math.random()*80-40)+"deg");
document.body.appendChild(s);(function(x){setTimeout(function(){x.remove()},1000)})(s);}
try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}
function confetti(){var c=["🎉","💖","✨","🌸"],col=["#ff5f6d","#ff9ebb","#ffd166","#fff","#e04656"];
for(var i=0;i<60;i++){var d=document.createElement("div");d.className="conf";
if(i%3===0){d.textContent=pick(c);d.style.fontSize="1.7rem";}else{d.style.width="11px";d.style.height="15px";d.style.background=pick(col);d.style.borderRadius=i%2?"50%":"3px";}
d.style.left=Math.random()*100+"vw";d.style.animationDuration=(2.2+Math.random()*2.3)+"s";d.style.animationDelay=Math.random()*1+"s";
document.body.appendChild(d);(function(x){setTimeout(function(){x.remove()},6000)})(d);}
try{navigator.vibrate&&navigator.vibrate([60,40,60,40,120])}catch(e){}}

/* screens */
function home(){name="";confirmEmpty=false;mode("home",0);
show('<div class="emo logo">💌</div><h1>Hey…<br>one question.</h1><div class="btns"><button class="btn" data-a="start">Start 💘</button></div>');}

function q1(){mode("game",1);
show('<div class="emo">👋</div><h1>Hi! Can I ask you something?</h1><p>It’ll take less than a minute, and you can say no at any point.</p>'
+'<div class="btns"><button class="btn" data-a="q1y">Sure, go ahead</button><button class="btn alt" data-a="q1n">Not right now</button></div>');}
function q2(){mode("game",2);
show('<div class="emo">🌷</div><h1>I’d love to get to know you better.</h1><p>I don’t want to step on anyone’s toes, so first, are you single?</p>'
+'<div class="btns"><button class="btn" data-a="q2y">Yes, I’m single</button><button class="btn alt" data-a="q2n">No, I’m seeing someone</button></div>');}
function qName(){mode("game",3);
show('<div class="emo">✨</div><h1>Then I’d like to learn your name.</h1><p>I’d rather call you by it than “hey, you.”</p>'
+'<input id="nm" data-go="nameOk" maxlength="30" placeholder="Your first name" autocomplete="off" autocapitalize="words">'
+'<div class="btns"><button class="btn" data-a="nameOk">That’s me</button><button class="ghost" data-a="nameNo">I’d rather not say</button></div>');}
function qText(){mode("game",4);
show('<div class="emo">💬</div><h1>'+esc(name)+', I’ll be honest.</h1><p>You seem interesting, and I’d really like to know you more. That’s the only reason I’m asking: may I text you, so we can talk properly?</p>'
+'<div class="btns"><button class="btn" data-a="txtY">Yes, you can text me</button><button class="btn alt" data-a="txtN">No, thank you</button></div>');}
function qNum(){mode("game",5);
show('<div class="emo">📱</div><h1>Thank you, '+esc(name)+'.</h1><p>What number should I use? I’ll start with a simple “hi”. No pressure at all.</p>'
+'<input id="ph" data-go="numOk" type="tel" inputmode="tel" maxlength="22" placeholder="Your number" autocomplete="off">'
+'<div class="btns"><button class="btn" data-a="numOk">Share my number</button><button class="ghost" data-a="txtN">Actually, never mind</button></div>');}

var EXITS={
q1:["🌸","That’s completely fine.","Thanks for taking a moment to read this. I hope you have a wonderful day."],
single:["🤍","Thank you for telling me.","I appreciate your honesty, and I wish you a lovely day."],
name:["🕊️","No problem at all.","You don’t owe me anything. Thanks for hearing me out, and take care."],
text:["🙌","I respect that.","Thank you for being kind about it. It was nice to meet you. Take care."]};
function exit(k){mode("game",0);var e=EXITS[k];burst(["🌸","🤍"],6);
show('<div class="emo">'+e[0]+'</div><h1>'+e[1]+'</h1><p>'+e[2]+'</p><div class="btns"><button class="btn" data-a="bye">Take care 👋</button></div>');}
function bye(){mode("game",0);show('<div class="emo">💗</div><h1>Thank you for your time.</h1><p>You can hand the phone back now.</p>');}
function finale(){mode("game",5);confetti();setTimeout(confetti,1800);
show('<div class="emo">🎉</div><h1>Check your phone, '+esc(name)+'!</h1><p>A message from me is on its way. It was really nice to meet you.</p><div class="btns"><button class="btn" data-a="bye">Done</button></div>');}

function bucket(){mode("bucket",0);var a=load().slice().reverse();
var h='<div class="emo">🪣</div><div class="count">'+a.length+'</div><p>'+(a.length===1?"number collected":"numbers collected")+'</p>';
if(!a.length){h+='<p>Nothing here yet. When someone says yes, her name and number will show up here.</p>';}
else{h+='<div id="list">'+a.map(function(c){var d=new Date(c.t),ts=isNaN(d)?"":d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
return'<div class="row"><div class="av">'+esc((c.name||"?").charAt(0).toUpperCase())+'</div><div><b>'+esc(c.name||"Unknown")+'</b><a href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a><small>'+ts+'</small></div></div>';}).join("")+'</div>';}
h+='<div class="btns"><button class="btn" data-a="home">Back</button>'+(a.length?'<button class="ghost danger" data-a="empty">'+(confirmEmpty?"Tap again to empty the bucket":"Empty the bucket")+'</button>':"")+'</div>'
+(store?"":'<div class="warn">Browser storage is unavailable, so these are only kept until this page closes.</div>');
show(h);}

/* actions */
var act={
start:q1,home:home,
q1y:function(){burst(["😊","💗"]);q2();},
q1n:function(){exit("q1");},
q2y:function(){burst(["✨","💗","😊"]);qName();},
q2n:function(){exit("single");},
nameOk:function(){var i=$("#nm"),v=i.value.trim();if(!v){i.classList.remove("shake");void i.offsetWidth;i.classList.add("shake");return;}
name=v;burst(["😍","💖","✨"]);qText();},
nameNo:function(){exit("name");},
txtY:function(){burst(["💌","🥰","✨"]);qNum();},
txtN:function(){exit("text");},
numOk:function(){var i=$("#ph"),v=i.value.trim(),d=v.replace(/\D/g,"");
if(d.length<7||d.length>15||/[^\d\s()+\-.]/.test(v)){i.classList.remove("shake");void i.offsetWidth;i.classList.add("shake");return;}
var a=load();a.push({name:name,phone:v,t:Date.now()});save(a);finale();},
bye:bye,
empty:function(){clearTimeout(emptyTimer);
if(!confirmEmpty){confirmEmpty=true;bucket();emptyTimer=setTimeout(function(){if(confirmEmpty&&document.body.className==="bucket"){confirmEmpty=false;bucket();}},3500);return;}
confirmEmpty=false;save([]);bucket();}
};
app.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(b&&act[b.dataset.a])act[b.dataset.a]();});
app.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.go)act[e.target.dataset.go]();});

/* hidden taps: top-right corner x3 on the start screen opens the bucket; top-left corner x5 during the game returns to start */
function tapper(id,count,fn){var taps=[];document.getElementById(id).addEventListener("click",function(){var n=Date.now();taps=taps.filter(function(t){return n-t<2500});taps.push(n);if(taps.length>=count){taps=[];fn();}});}
tapper("zr",3,bucket);
tapper("zl",5,home);

home();
})();
</script>
</body>
</html>
